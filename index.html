<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checklist</title>
<!-- Excel (.xlsx) okuma/yazma için -->
<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --blue:#305496;
    --blue-dark:#253f70;
    --bg:#f4f6fa;
    --card:#ffffff;
    --border:#e2e6ee;
    --text:#1f2937;
    --muted:#8a93a5;
    --green:#2e9e5b;
    --red:#e5484d;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
    display:flex;
    justify-content:center;
    padding:24px 16px;
  }
  .app{
    width:100%;
    max-width:900px;
    max-height:100%;
    background:var(--card);
    border-radius:16px;
    box-shadow:0 10px 30px rgba(16,24,40,.08);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  /* ---------- Başlık ---------- */
  header{
    padding:18px 22px;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
  }
  header h1{
    margin:0;
    font-size:19px;
    font-weight:600;
    letter-spacing:.2px;
    color:var(--blue);
  }
  .progress-wrap{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:220px;
    flex:1;
    justify-content:flex-end;
  }
  .progress-bar{
    flex:1;
    max-width:180px;
    height:8px;
    background:#eaeef5;
    border-radius:99px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#3f6ec4,#2e9e5b);
    border-radius:99px;
    transition:width .3s ease;
  }
  #progressText{
    font-size:13px;
    color:var(--muted);
    white-space:nowrap;
  }

  /* ---------- Görev ekleme ---------- */
  .add-row{
    display:flex;
    gap:8px;
    padding:16px 22px 8px;
  }
  .add-row input[type=text]{
    flex:1;
    padding:11px 14px;
    font-size:15px;
    border:1px solid var(--border);
    border-radius:10px;
    outline:none;
    transition:border-color .15s, box-shadow .15s;
    font-family:inherit;
  }
  .add-row input[type=text]:focus{
    border-color:var(--blue);
    box-shadow:0 0 0 3px rgba(48,84,150,.13);
  }

  /* ---------- Butonlar ---------- */
  .btn{
    padding:10px 15px;
    font-size:13.5px;
    font-family:inherit;
    border:1px solid var(--border);
    background:#fff;
    color:#48536b;
    border-radius:10px;
    cursor:pointer;
    transition:all .15s;
    white-space:nowrap;
  }
  .btn:hover{background:#f2f5fa;border-color:#cdd5e2;}
  .btn:active{transform:translateY(1px);}
  .btn.primary{
    background:var(--blue);
    border-color:var(--blue);
    color:#fff;
    font-weight:600;
  }
  .btn.primary:hover{background:var(--blue-dark);border-color:var(--blue-dark);}

  .toolbar{
    display:flex;
    gap:8px;
    padding:8px 22px 14px;
    flex-wrap:wrap;
    border-bottom:1px solid var(--border);
  }

  /* ---------- Liste ---------- */
  .list-wrap{
    flex:1;
    overflow-y:auto;
    min-height:120px;
  }
  table{
    width:100%;
    border-collapse:collapse;
    font-size:14.5px;
  }
  thead th{
    position:sticky;
    top:0;
    background:#f8fafc;
    z-index:1;
    text-align:left;
    font-size:12px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:.5px;
    color:var(--muted);
    padding:10px 12px;
    border-bottom:1px solid var(--border);
  }
  tbody td{
    padding:10px 12px;
    border-bottom:1px solid #f0f2f7;
    vertical-align:middle;
  }
  tbody tr:hover{background:#f9fbfe;}
  tbody tr.done .col-gorev{
    color:#9aa4b6;
    text-decoration:line-through;
  }
  .col-durum{width:38px;text-align:center;}
  .col-durum input[type=checkbox]{
    width:18px;height:18px;
    accent-color:var(--blue);
    cursor:pointer;
    vertical-align:middle;
  }
  .col-ekl,.col-tam{
    width:132px;
    color:var(--muted);
    font-size:12.5px;
    white-space:nowrap;
  }
  .col-sil{width:44px;text-align:center;}
  .del{
    border:none;
    background:transparent;
    color:#c3cad6;
    font-size:20px;
    line-height:1;
    cursor:pointer;
    border-radius:8px;
    width:30px;height:30px;
    transition:all .15s;
  }
  .del:hover{background:#fdecec;color:var(--red);}

  .empty{
    display:none;
    padding:48px 20px;
    text-align:center;
    color:var(--muted);
    font-size:14px;
  }
  .empty.show{display:block;}

  /* ---------- Alt bilgi ---------- */
  footer{
    padding:10px 22px;
    font-size:12px;
    color:var(--muted);
    border-top:1px solid var(--border);
    background:#fbfcfe;
  }

  /* ---------- Duyarlı ---------- */
  @media (max-width:720px){
    .col-tam{display:none;}
  }
  @media (max-width:520px){
    .col-ekl{display:none;}
    body{padding:0;}
    .app{max-height:100%;border-radius:0;}
    header h1{font-size:17px;}
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <h1>✓ Checklist</h1>
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <span id="progressText">0/0 tamamlandı (%0)</span>
    </div>
  </header>

  <div class="add-row">
    <input id="giris" type="text" placeholder="Yeni görev ekle..." autocomplete="off" autofocus>
    <button class="btn primary" id="ekleBtn">Ekle</button>
  </div>

  <div class="toolbar">
    <button class="btn" id="temizleBtn">Tamamlananları Temizle</button>
    <button class="btn" id="excelAktarBtn">Excel'e Aktar</button>
    <button class="btn" id="excelYukleBtn">Excel'den Yükle</button>
    <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" hidden>
  </div>

  <div class="list-wrap">
    <table>
      <thead>
        <tr>
          <th class="col-durum">✔</th>
          <th class="col-gorev">Görev</th>
          <th class="col-ekl">Eklenme</th>
          <th class="col-tam">Tamamlanma</th>
          <th class="col-sil"></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty" id="empty">Henüz görev yok. Yukarıdan ekleyerek başla.</div>
  </div>

  <footer>Veriler bu tarayıcıda saklanır · Çift tıklayarak durumu değiştir</footer>
</div>

<script>
(function () {
  "use strict";

  const STORAGE_KEY = "checklist_v1";

  /** @type {Array<[string, "Evet"|"Hayır", string, string]>} */
  let satirlar = [];

  const $ = (id) => document.getElementById(id);
  const tbody      = $("tbody");
  const giris      = $("giris");
  const emptyEl    = $("empty");
  const fileInput  = $("fileInput");
  const progressFill = $("progressFill");
  const progressText = $("progressText");

  /* ----------------------------- YARDIMCILAR ----------------------------- */

  function iki(n) { return String(n).padStart(2, "0"); }

  /** dd.mm.yyyy hh:mm */
  function tarihFormat(d = new Date()) {
    return `${iki(d.getDate())}.${iki(d.getMonth() + 1)}.${d.getFullYear()} ${iki(d.getHours())}:${iki(d.getMinutes())}`;
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => (
      { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
    ));
  }

  /** Python tarafındaki durum normalizasyonu ile aynı mantık */
  function durumNormalize(deger) {
    const v = String(deger ?? "").trim().toLowerCase();
    return ["evet", "x", "✔", "true", "1"].includes(v) ? "Evet" : "Hayır";
  }

  /* ------------------------------ KAYIT ------------------------------ */

  function yukle() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      const veri = raw ? JSON.parse(raw) : [];
      satirlar = Array.isArray(veri)
        ? veri.filter((r) => Array.isArray(r) && r[0]).map((r) => [
            String(r[0]),
            r[1] === "Evet" ? "Evet" : "Hayır",
            String(r[2] ?? ""),
            String(r[3] ?? ""),
          ])
        : [];
    } catch (e) {
      satirlar = [];
    }
  }

  function kaydet() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(satirlar));
    } catch (e) {
      alert("Kayıt yapılamadı (tarayıcı depolaması dolu olabilir).");
    }
  }

  /* ------------------------------ ÇİZİM ------------------------------ */

  function goster() {
    tbody.innerHTML = "";

    satirlar.forEach((s, i) => {
      const bitti = s[1] === "Evet";
      const tr = document.createElement("tr");
      if (bitti) tr.className = "done";
      tr.dataset.i = String(i);

      tr.innerHTML =
        '<td class="col-durum"><input type="checkbox" ' + (bitti ? "checked" : "") +
          ' aria-label="Tamamlandı işaretle"></td>' +
        '<td class="col-gorev">' + esc(s[0]) + "</td>" +
        '<td class="col-ekl">' + esc(s[2]) + "</td>" +
        '<td class="col-tam">' + esc(s[3]) + "</td>" +
        '<td class="col-sil"><button class="del" title="Sil">×</button></td>';

      tbody.appendChild(tr);
    });

    emptyEl.classList.toggle("show", satirlar.length === 0);
    ilerlemeGuncelle();
  }

  function ilerlemeGuncelle() {
    const toplam = satirlar.length;
    const biten = satirlar.reduce((t, s) => t + (s[1] === "Evet" ? 1 : 0), 0);
    const yuzde = toplam ? Math.round((biten * 100) / toplam) : 0;
    progressFill.style.width = yuzde + "%";
    progressText.textContent = `${biten}/${toplam} tamamlandı (%${yuzde})`;
  }

  /* ----------------------------- İŞLEMLER ----------------------------- */

  function ekle() {
    const metin = giris.value.trim();
    if (!metin) { giris.focus(); return; }
    satirlar.push([metin, "Hayır", tarihFormat(), ""]);
    kaydet();
    giris.value = "";
    giris.focus();
    goster();
  }

  function durumDegistir(i) {
    const s = satirlar[i];
    if (!s) return;
    if (s[1] === "Evet") {
      s[1] = "Hayır";
      s[3] = "";
    } else {
      s[1] = "Evet";
      s[3] = tarihFormat();
    }
    kaydet();
    goster();
  }

  function sil(i) {
    const s = satirlar[i];
    if (!s) return;
    if (!confirm(`"${s[0]}" silinsin mi?`)) return;
    satirlar.splice(i, 1);
    kaydet();
    goster();
  }

  function temizle() {
    const biten = satirlar.filter((s) => s[1] === "Evet").length;
    if (!biten) return;
    if (!confirm(`${biten} tamamlanan görev silinsin mi?`)) return;
    satirlar = satirlar.filter((s) => s[1] !== "Evet");
    kaydet();
    goster();
  }

  /* ------------------------------ EXCEL ------------------------------ */

  const BASLIKLAR = ["Görev", "Durum", "Eklenme Tarihi", "Tamamlanma Tarihi"];

  function excelAktar() {
    const veri = [BASLIKLAR].concat(satirlar.map((s) => [s[0], s[1], s[2], s[3]]));

    // SheetJS yüklüyse gerçek .xlsx üret
    if (typeof XLSX !== "undefined") {
      const ws = XLSX.utils.aoa_to_sheet(veri);
      ws["!cols"] = [{ wch: 50 }, { wch: 10 }, { wch: 20 }, { wch: 20 }];
      ws["!autofilter"] = { ref: `A1:D${veri.length}` };
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Checklist");
      XLSX.writeFile(wb, "checklist.xlsx");
      return;
    }

    // Çevrimdışıysa CSV (Excel uyumlu, noktalı virgül + BOM)
    const csv = "\uFEFF" + veri
      .map((r) => r.map((c) => `"${String(c).replace(/"/g, '""')}"`).join(";"))
      .join("\r\n");
    indir(new Blob([csv], { type: "text/csv;charset=utf-8;" }), "checklist.csv");
  }

  function indir(blob, ad) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = ad;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function excelYukleDosya(file) {
    if (typeof XLSX === "undefined") {
      alert("Excel kütüphanesi yüklenemedi (internet bağlantısı gerekli).");
      return;
    }
    const reader = new FileReader();

    reader.onload = (ev) => {
      try {
        const csvMi = /\.csv$/i.test(file.name);
        const wb = csvMi
          ? XLSX.read(ev.target.result, { type: "string" })
          : XLSX.read(new Uint8Array(ev.target.result), { type: "array" });

        const ws = wb.Sheets[wb.SheetNames[0]];
        if (!ws) throw new Error("Sayfa bulunamadı.");

        const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: "" });
        const yeni = [];

        rows.slice(1).forEach((r) => {
          if (!r || !r[0] || !String(r[0]).trim()) return;
          yeni.push([
            String(r[0]).trim(),
            durumNormalize(r[1]),
            String(r[2] ?? ""),
            String(r[3] ?? ""),
          ]);
        });

        if (!yeni.length) { alert("Dosyada okunabilir görev bulunamadı."); return; }

        const degistir = confirm(
          `${yeni.length} görev bulundu.\n\n` +
          "Tamam = Mevcut liste değiştirilsin\n" +
          "İptal = Mevcut listeye eklensin"
        );

        satirlar = degistir ? yeni : satirlar.concat(yeni);
        kaydet();
        goster();
      } catch (err) {
        alert("Dosya okunamadı:\n" + err.message);
      }
    };

    if (/\.csv$/i.test(file.name)) reader.readAsText(file, "utf-8");
    else reader.readAsArrayBuffer(file);
  }

  /* ------------------------------ OLAYLAR ------------------------------ */

  $("ekleBtn").addEventListener("click", ekle);
  giris.addEventListener("keydown", (e) => { if (e.key === "Enter") ekle(); });
  $("temizleBtn").addEventListener("click", temizle);
  $("excelAktarBtn").addEventListener("click", excelAktar);
  $("excelYukleBtn").addEventListener("click", () => fileInput.click());

  fileInput.addEventListener("change", (e) => {
    const f = e.target.files && e.target.files[0];
    if (f) excelYukleDosya(f);
    fileInput.value = "";
  });

  // Satır tıklamaları (olay delegasyonu)
  tbody.addEventListener("click", (e) => {
    const tr = e.target.closest("tr");
    if (!tr) return;
    const i = Number(tr.dataset.i);

    if (e.target.matches('input[type="checkbox"]')) {
      durumDegistir(i);
    } else if (e.target.closest(".del")) {
      sil(i);
    }
  });

  // Çift tıklama ile durum değiştir (Tkinter sürümündeki gibi)
  tbody.addEventListener("dblclick", (e) => {
    if (e.target.matches("input, button")) return;
    const tr = e.target.closest("tr");
    if (tr) durumDegistir(Number(tr.dataset.i));
  });

  /* ------------------------------- BAŞLAT ------------------------------- */
  yukle();
  goster();
  giris.focus();
})();
</script>
</body>
</html>
